services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      RAILS_ENV: production
      RAILS_LOG_LEVEL: info
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-local_deploy_secret_key_base_change_me_1234567890}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-3001}:80"
    volumes:
      - backend_storage:/rails/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_storage:
